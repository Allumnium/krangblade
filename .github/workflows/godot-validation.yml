name: Godot validation

on:
  # Temporarily manual-only for rapid iteration. Restore push/PR triggers
  # when automated validation is re-enabled.
  workflow_dispatch:

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      cases: ${{ steps.scope.outputs.cases }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify game version increases with every commit
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          def version(commit):
              data = git("show", f"{commit}:project.godot")
              match = re.search(r'^config/version="([^"]+)"$', data, re.M)
              if not match:
                  return None
              value = match.group(1)
              if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', value):
                  raise SystemExit(f"{commit}: invalid version {value}; use MAJOR.MINOR.PATCH")
              return tuple(map(int, value.split(".")))
          head = os.environ["HEAD"]
          base = os.environ.get("BASE", "")
          current = version(head)
          if current is None:
              raise SystemExit("project.godot must specify config/version")
          if base and set(base) != {"0"}:
              target = version(base)
              if target is not None and current <= target:
                  raise SystemExit(f"Version {current} must exceed target {target}")
              if os.environ["EVENT"] == "pull_request":
                  base = git("merge-base", base, head)
              prior = version(base)
              for commit in git("rev-list", "--first-parent", "--reverse", f"{base}..{head}").splitlines():
                  next_version = version(commit)
                  if prior is not None and (next_version is None or next_version <= prior):
                      raise SystemExit(f"{commit}: version must increase from {prior} to a newer MAJOR.MINOR.PATCH")
                  prior = next_version
          print("Verified version:", current)
          PY
      - name: Verify Godot script and shader indentation
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          paths = subprocess.check_output(["git", "ls-files", "-z", "--", "*.gd", "*.gdshader"]).decode().split("\0")
          errors = []
          for path in filter(None, paths):
              for line_number, line in enumerate(pathlib.Path(path).read_text(encoding="utf-8").splitlines(), 1):
                  if re.match(r"^[\t ]* ", line):
                      errors.append(f"{path}:{line_number}: use tabs for indentation")
          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          print("Verified tab indentation in tracked Godot scripts and shaders")
          PY
      - name: Verify documentation-only scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-ci-docs') }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, json
          def git(*args):
              return subprocess.check_output(["git", *args])
          base, head = os.environ["BASE"], os.environ["HEAD"]
          eligible = False
          fast = False
          # Only explicitly labeled PRs qualify. Main pushes and manual runs
          # continue to run every test.
          if os.environ["EVENT"] == "pull_request":
              base = git("merge-base", base, head).decode().strip()
              paths = git("diff", "--name-only", "--no-renames", "-z", base, head).decode().split("\\0")
              paths = [p for p in paths if p]
              docs = {"README.md", "AGENTS.md", "TODO.md", "THOUGHTS.md", "THOUGHTS_ARCHIVE.md"}
              eligible = os.environ["LABEL"] == "true" and bool(set(paths) & docs) and set(paths) <= docs | {"project.godot"}
              presentation = {"scripts/main.gd", "scripts/match.gd", "scripts/ui_theme.gd", "scripts/space_background.gd"}
              fast = bool(set(paths) & presentation) and set(paths) <= docs | presentation | {"project.godot"}
              if (eligible or fast) and "project.godot" in paths:
                  def without_version(ref):
                      return re.sub(rb'^config/version="[^"]+"$', b'config/version="VERSION"', git("show", ref + ":project.godot"), flags=re.M)
                  same_config = without_version(base) == without_version(head)
                  eligible = eligible and same_config
                  fast = fast and same_config
          cases = [{"count": 2, "mode": "normal"}, {"count": 2, "mode": "threaded"}]
          if not fast:
              cases += [{"count": 3, "mode": "normal"}, {"count": 3, "mode": "threaded"}, {"count": 2, "mode": "drop-loading"}, {"count": 2, "mode": "host-leave"}]
          if os.environ["EVENT"] == "workflow_dispatch":
              cases += [{"count": 8, "mode": "normal"}, {"count": 8, "mode": "threaded"}]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("cases=" + json.dumps({"include": cases}, separators=(",", ":")), file=output)
              print("docs_only=" + str(eligible).lower(), file=output)
          print("Documentation-only shortcut:", eligible)
          PY
  core:
    needs: gate
    if: needs.gate.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-4.7.2-${{ runner.os }}-imports-${{ hashFiles('assets/**', '**/*.import', 'project.godot') }}
          restore-keys: |
            godot-4.7.2-${{ runner.os }}-imports-
      - name: Import
        run: godot --headless --path . --import
      - name: Check resource metadata is tracked and stable
        run: |
          changes="$(git status --porcelain --untracked-files=all -- '*.uid' '*.import')"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo "Commit generated resource .uid and asset .import sidecars."
            exit 1
          fi
      - name: Parse all tracked GDScript files
        run: python3 tools/check_gdscript.py
      - name: Snapshot codec round-trip regressions
        run: godot --headless --path . --script res://tests/snapshot_codec_test.gd
      - name: Enforce public simulation rule calls from match UI
        run: python3 tools/check_ui_rule_boundaries.py
      - name: Pure base construction recipes
        run: godot --headless --path . --script res://tests/construction_queries_test.gd
      - name: Lobby and territory rules
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/lobby_rules_test.gd 2>&1 | awk '{ print; fflush(); if ($0 ~ /SCRIPT ERROR:|Assertion failed/) { failed=1; remaining=8 } else if (failed && --remaining <= 0) exit 1 } END { if (failed) exit 1 }'
      - name: Economy and logistics rules
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/economy_rules_test.gd 2>&1 | awk '{ print; fflush(); if ($0 ~ /SCRIPT ERROR:|Assertion failed/) { failed=1; remaining=8 } else if (failed && --remaining <= 0) exit 1 } END { if (failed) exit 1 }'
      - name: Check deterministic replay in independent Godot processes
        run: python3 tools/check_determinism.py
      - name: Solo match smoke test
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/solo_smoke.gd 2>&1 | awk '{ print; fflush(); if ($0 ~ /SCRIPT ERROR:|Assertion failed/) { failed=1; remaining=8 } else if (failed && --remaining <= 0) exit 1 } END { if (failed) exit 1 }'
      - name: Independent authority worker and session lifecycle
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/authority_worker_test.gd 2>&1 | awk '{ print; fflush(); if ($0 ~ /SCRIPT ERROR:|Assertion failed/) { failed=1; remaining=8 } else if (failed && --remaining <= 0) exit 1 } END { if (failed) exit 1 }'
      - name: Startup smoke test
        run: godot --headless --path . --quit-after 3
  network:
    needs: gate
    if: needs.gate.outputs.docs_only != 'true'
    name: ENet ${{ matrix.count }} players / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.cases || '{"include":[{"count":2,"mode":"normal"}]}') }}
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-4.7.2-${{ runner.os }}-imports-${{ hashFiles('assets/**', '**/*.import', 'project.godot') }}
          restore-keys: |
            godot-4.7.2-${{ runner.os }}-imports-
      - name: Import
        run: godot --headless --path . --import
      - name: Check resource metadata is tracked and stable
        run: |
          changes="$(git status --porcelain --untracked-files=all -- '*.uid' '*.import')"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo "Commit generated resource .uid and asset .import sidecars."
            exit 1
          fi
      - name: Real ENet multiplayer round trip or disconnect recovery
        shell: bash
        env:
          PLAYER_COUNT: ${{ matrix.count }}
          CASE_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          run_case() {
            local count="$1"
            local mode="$2"
            local failures=0
            local pids=""
            # Each ENet player is a separate Godot process on one CI runner.
            # Eight peers contend for CPU; retain ALL network checks with a
            # longer wall-clock budget, never a shorter or lighter test.
            local deadline="75s"
            if ((count >= 8)); then deadline="350s"
            elif ((count >= 3)); then deadline="200s"
            fi
            timeout "$deadline" godot --headless --max-fps 60 --path . --script res://tests/network_smoke.gd -- host "$count" "$mode" > "/tmp/host-$count-$mode.log" 2>&1 &
            pids="$pids $!"
            sleep 1
            for ((n=1;n<count;n++)); do
              timeout "$deadline" godot --headless --max-fps 60 --path . --script res://tests/network_smoke.gd -- client "$count" "$n" "$mode" > "/tmp/client-$count-$mode-$n.log" 2>&1 &
              pids="$pids $!"
            done
            for pid in $pids; do
              wait "$pid" || failures=1
            done
            for log in "/tmp/host-$count-$mode.log" /tmp/client-"$count"-"$mode"-*.log; do
              echo "--- $log ---"
              cat "$log"
              grep -q "PASS: network" "$log" || failures=1
            done
            test "$failures" -eq 0
          }
          run_case "$PLAYER_COUNT" "$CASE_MODE"

  # Informational profiling is independent of the gameplay/network gate.
  # It runs on explicit manual dispatch and never asserts hardware-specific
  # millisecond thresholds or changes the required validate job.
  profile:
    needs: gate
    if: ${{ github.event_name == 'workflow_dispatch' && needs.gate.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Import
        run: godot --headless --path . --import
      - name: Capture representative headless simulation timings
        run: python3 tools/profile_simulation.py --ships 500,1000 --scenarios battle,logistics --speeds 1,5 --seeds 827 --ticks 100 --timeout 300 --output performance-baseline.json
      - name: Publish non-gating performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warbound-headless-profile-${{ github.run_number }}
          path: performance-baseline.json
          if-no-files-found: warn
          retention-days: 30

  # Keep the aggregate check required. Only the verified docs gate may skip tests.
  validate:
    runs-on: ubuntu-latest
    needs: [gate, core, network]
    if: ${{ always() }}
    steps:
      - name: Require every validation job to pass
        env:
          GATE: ${{ needs.gate.result }}
          DOCS: ${{ needs.gate.outputs.docs_only }}
          CORE: ${{ needs.core.result }}
          NETWORK: ${{ needs.network.result }}
        run: |
          test "$GATE" = success
          if [ "$DOCS" = true ]; then
            test "$CORE" = skipped
            test "$NETWORK" = skipped
          else
            test "$CORE" = success
            test "$NETWORK" = success
          fi
