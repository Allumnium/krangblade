name: Godot validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - run: godot --headless --path . --import
      - run: godot --headless --path . --check-only --script res://scripts/main.gd
      - run: godot --headless --path . --check-only --script res://scripts/match.gd
      - run: godot --headless --path . --check-only --script res://scripts/lobby_rules.gd
      - run: godot --headless --path . --script res://tests/lobby_rules_test.gd
      - run: godot --headless --path . --quit-after 3
