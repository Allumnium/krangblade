name: Godot validation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify game version increases with every commit
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          def version(commit):
              data = git("show", f"{commit}:project.godot")
              match = re.search(r'^config/version="([^"]+)"$', data, re.M)
              if not match:
                  return None
              value = match.group(1)
              if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', value):
                  raise SystemExit(f"{commit}: invalid version {value}; use MAJOR.MINOR.PATCH")
              return tuple(map(int, value.split(".")))
          head = os.environ["HEAD"]
          base = os.environ.get("BASE", "")
          current = version(head)
          if current is None:
              raise SystemExit("project.godot must specify config/version")
          if base and set(base) != {"0"}:
              target = version(base)
              if target is not None and current <= target:
                  raise SystemExit(f"Version {current} must exceed target {target}")
              if os.environ["EVENT"] == "pull_request":
                  base = git("merge-base", base, head)
              prior = version(base)
              for commit in git("rev-list", "--first-parent", "--reverse", f"{base}..{head}").splitlines():
                  next_version = version(commit)
                  if prior is not None and (next_version is None or next_version <= prior):
                      raise SystemExit(f"{commit}: version must increase from {prior} to a newer MAJOR.MINOR.PATCH")
                  prior = next_version
          print("Verified version:", current)
          PY
      - name: Verify documentation-only scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-ci-docs') }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          def git(*args):
              return subprocess.check_output(["git", *args])
          base, head = os.environ["BASE"], os.environ["HEAD"]
          eligible = False
          # Only explicitly labeled PRs qualify. Main pushes and manual runs
          # continue to run every test.
          if os.environ["EVENT"] == "pull_request" and os.environ["LABEL"] == "true":
              base = git("merge-base", base, head).decode().strip()
              paths = git("diff", "--name-only", "--no-renames", "-z", base, head).decode().split("\\0")
              paths = [p for p in paths if p]
              docs = {"README.md", "AGENTS.md", "TODO.md", "THOUGHTS.md", "THOUGHTS_ARCHIVE.md"}
              eligible = bool(set(paths) & docs) and set(paths) <= docs | {"project.godot"}
              if eligible and "project.godot" in paths:
                  def without_version(ref):
                      return re.sub(rb'^config/version="[^"]+"$', b'config/version="VERSION"', git("show", ref + ":project.godot"), flags=re.M)
                  eligible = without_version(base) == without_version(head)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("docs_only=" + str(eligible).lower(), file=output)
          print("Documentation-only shortcut:", eligible)
          PY
  core:
    needs: gate
    if: needs.gate.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Import
        run: godot --headless --path . --import
      - name: Check resource metadata is tracked and stable
        run: |
          changes="$(git status --porcelain --untracked-files=all -- '*.uid' '*.import')"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo "Commit generated resource .uid and asset .import sidecars."
            exit 1
          fi
      - name: Parse scenes and network scripts
        run: |
          godot --headless --path . --check-only --script res://scripts/main.gd
          godot --headless --path . --check-only --script res://scripts/match.gd
          godot --headless --path . --check-only --script res://scripts/game_session.gd
          godot --headless --path . --check-only --script res://scripts/lobby_rules.gd
          godot --headless --path . --check-only --script res://scripts/planet_map.gd
          godot --headless --path . --check-only --script res://scripts/economy_rules.gd
          godot --headless --path . --check-only --script res://tests/economy_rules_test.gd
          godot --headless --path . --check-only --script res://tests/solo_smoke.gd
          godot --headless --path . --check-only --script res://tests/network_smoke.gd
      - name: Lobby and territory rules
        run: godot --headless --path . --script res://tests/lobby_rules_test.gd
      - name: Economy and logistics rules
        run: godot --headless --path . --script res://tests/economy_rules_test.gd
      - name: Solo match smoke test
        run: godot --headless --path . --script res://tests/solo_smoke.gd
      - name: Startup smoke test
        run: godot --headless --path . --quit-after 3
  network:
    needs: gate
    if: needs.gate.outputs.docs_only != 'true'
    name: ENet ${{ matrix.count }} players / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - count: 2
            mode: normal
          - count: 8
            mode: normal
          - count: 2
            mode: drop-loading
          - count: 2
            mode: host-leave
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Import
        run: godot --headless --path . --import
      - name: Check resource metadata is tracked and stable
        run: |
          changes="$(git status --porcelain --untracked-files=all -- '*.uid' '*.import')"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo "Commit generated resource .uid and asset .import sidecars."
            exit 1
          fi
      - name: Real ENet multiplayer round trip or disconnect recovery
        shell: bash
        env:
          PLAYER_COUNT: ${{ matrix.count }}
          CASE_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          run_case() {
            local count="$1"
            local mode="$2"
            local failures=0
            local pids=""
            timeout 75s godot --headless --max-fps 60 --path . --script res://tests/network_smoke.gd -- host "$count" "$mode" > "/tmp/host-$count-$mode.log" 2>&1 &
            pids="$pids $!"
            sleep 1
            for ((n=1;n<count;n++)); do
              timeout 75s godot --headless --max-fps 60 --path . --script res://tests/network_smoke.gd -- client "$count" "$n" "$mode" > "/tmp/client-$count-$mode-$n.log" 2>&1 &
              pids="$pids $!"
            done
            for pid in $pids; do
              wait "$pid" || failures=1
            done
            for log in "/tmp/host-$count-$mode.log" /tmp/client-"$count"-"$mode"-*.log; do
              echo "--- $log ---"
              cat "$log"
              grep -q "PASS: network" "$log" || failures=1
            done
            test "$failures" -eq 0
          }
          run_case "$PLAYER_COUNT" "$CASE_MODE"

  # Keep the aggregate check required. Only the verified docs gate may skip tests.
  validate:
    runs-on: ubuntu-latest
    needs: [gate, core, network]
    if: ${{ always() }}
    steps:
      - name: Require every validation job to pass
        env:
          GATE: ${{ needs.gate.result }}
          DOCS: ${{ needs.gate.outputs.docs_only }}
          CORE: ${{ needs.core.result }}
          NETWORK: ${{ needs.network.result }}
        run: |
          test "$GATE" = success
          if [ "$DOCS" = true ]; then
            test "$CORE" = skipped
            test "$NETWORK" = skipped
          else
            test "$CORE" = success
            test "$NETWORK" = success
          fi
